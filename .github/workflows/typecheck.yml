name: Typecheck

# The package ships TypeScript source (no build, no registry): consumers install a tag,
# e.g. "github:Pacific-Code-Labs/fire-code-design-system#v0.2.0". CI only proves it compiles.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
