name: Publish to GitHub Packages

# Publishes @firecode/design-system to GitHub Packages (npm.pkg.github.com)
# so fire-code-fe + fire-code-admin can install the PREBUILT package in their
# own CI (the `file:../fire-code-design-system` dev path fails in CI — the
# sibling repo isn't checked out / its dist/ is unbuilt).
#
# Trigger: a published GitHub Release (tag-driven, the canonical path) or a
# manual dispatch. The release tag should match the package.json "version"
# (e.g. v0.1.0 / 0.1.0) — bump the version before tagging or the publish 409s.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node writes a project .npmrc with the registry + the
      # //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN} line, so
      # `npm publish` authenticates with the per-job GITHUB_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@pacific-code-labs'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Build with Bun (canonical PM, matches fire-code-fe) — installs the
      # devDependencies (Radix/recharts/etc.) so the lib build + types emit.
      - name: Install
        run: bun install

      - name: Build
        run: bun run build

      # Publish with npm so the setup-node registry/auth wiring applies.
      # prepublishOnly re-runs the build (npm-side) to guarantee a fresh dist.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
